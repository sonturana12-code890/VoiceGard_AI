# ==============================================================================
# VOICEGUARD AI — Render Blueprint (render.yaml)
# Deploy FastAPI Backend + WebSockets + PostgreSQL Database
# ==============================================================================
services:
  - type: web
    name: voiceguard-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter # 1 GB RAM recommended for neural ONNX inference
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: CORS_ORIGINS
        value: https://voiceguard.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: voiceguard-db
          property: connectionString

databases:
  - name: voiceguard-db
    plan: free
    region: oregon
    databaseName: voiceguard
    user: voiceguard_user
